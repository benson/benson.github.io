<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>worldview</title>
  <meta name="description" content="a concise record of what i think">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet">
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>worldview</h1>
      <p>a concise record of what i actually think, in language close to how i said it.</p>
    </header>

    <section class="controls" aria-label="belief filters">
      <label>
        <span>search</span>
        <input id="search" type="search" placeholder="what do i think about..." autocomplete="off">
      </label>
      <label>
        <span>status</span>
        <select id="status">
          <option value="current">current</option>
          <option value="tentative">tentative</option>
          <option value="all">everything</option>
        </select>
      </label>
      <label>
        <span>domain</span>
        <select id="domain"><option value="all">all domains</option></select>
      </label>
    </section>

    <div class="explorer">
      <nav aria-label="beliefs">
        <p id="count" class="muted"></p>
        <ul id="belief-list"></ul>
      </nav>
      <article id="belief-detail" aria-live="polite"></article>
    </div>

    <footer>markdown is canonical. this page is a read-only index.</footer>
  </main>

  <script src="beliefs.js"></script>
  <script src="app.js"></script>
</body>
</html>
