name: Update Trophy Seats

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

concurrency:
  group: update-trophy-seats
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore individual draft logs
        uses: actions/cache/restore@v4
        with:
          path: trophy-seat/.cache/trophy-logs/
          key: trophy-seat-logs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: trophy-seat-logs-
      - name: Discover and validate new draft formats
        run: node trophy-seat/scripts/build-data.mjs --limit 50
      - name: Preserve acquired logs even when the provider limits requests
        if: always()
        uses: actions/cache/save@v4
        with:
          path: trophy-seat/.cache/trophy-logs/
          key: trophy-seat-logs-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate every published trophy seat
        run: node --test trophy-seat/tests/*.test.js
      - name: Publish changed catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add trophy-seat/data/
          if git diff --cached --quiet; then
            echo "Trophy Seat already has the latest available formats."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "update verified trophy draft formats"
          git pull --rebase origin master
          git push origin HEAD:master
          gh workflow run deploy-pages.yml --ref master
